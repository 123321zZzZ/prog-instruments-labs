name: Lab 1 checks

on:
  push:
    paths:
      - "lab_1/**"
      - ".github/workflows/lab_1.yml"
  pull_request:
    paths:
      - "lab_1/**"
      - ".github/workflows/lab_1.yml"

permissions:
  contents: read

jobs:
  checks:
    name: ruff + pyright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab_1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab_1/requirements-dev.txt

      - name: Install dependencies
        run: make install

      - name: Lint (ruff check)
        run: make lint

      - name: Format check (ruff format --check)
        run: make format-check

      - name: Type check (pyright)
        run: make typecheck
